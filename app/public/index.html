<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>URL Shortener</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --card:#f4f4f5; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#eee; --muted:#999; --card:#1d1d1f; --accent:#60a5fa; } }
  body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); max-width: 640px; margin: 3rem auto; padding: 0 1rem; }
  form { display: flex; gap: .5rem; }
  input { flex: 1; padding: .6rem; border: 1px solid var(--muted); border-radius: 6px; background: var(--card); color: var(--fg); }
  button { padding: .6rem 1rem; border: 0; border-radius: 6px; background: var(--accent); color: #fff; cursor: pointer; }
  .card { background: var(--card); border-radius: 8px; padding: .8rem 1rem; margin-top: .8rem; }
  .muted { color: var(--muted); font-size: .85rem; word-break: break-all; }
  #msg { margin-top: .8rem; min-height: 1.2rem; }
  a { color: var(--accent); }
</style>
</head>
<body>
<h1>URL Shortener</h1>
<form id="f">
  <input id="url" type="url" placeholder="https://example.com/a/very/long/link" required>
  <button type="submit">Shorten</button>
</form>
<div id="msg" class="muted"></div>
<h2>My links</h2>
<div id="list"></div>

<script>
const KEY = 'my-links';
const form = document.getElementById('f');
const urlInput = document.getElementById('url');
const msg = document.getElementById('msg');
const list = document.getElementById('list');

const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } };
const save = (l) => { try { localStorage.setItem(KEY, JSON.stringify(l)); } catch {} };

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  msg.textContent = '...';
  try {
    const r = await fetch('/api/shorten', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ longUrl: urlInput.value }),
    });
    const data = await r.json();
    if (!r.ok) { msg.textContent = data.error || 'Error'; return; }
    const links = load();
    links.unshift({ code: data.shortCode, shortUrl: data.shortUrl, longUrl: urlInput.value });
    save(links.slice(0, 20));
    urlInput.value = '';
    msg.textContent = 'Created: ' + data.shortUrl;
    render();
  } catch { msg.textContent = 'Network error'; }
});

function render() {
  list.textContent = '';
  for (const l of load()) {
    const card = document.createElement('div'); card.className = 'card';
    const a = document.createElement('a'); a.href = l.shortUrl; a.textContent = l.shortUrl; a.target = '_blank'; a.rel = 'noopener';
    const sub = document.createElement('div'); sub.className = 'muted'; sub.textContent = l.longUrl;
    const clicks = document.createElement('div'); clicks.className = 'muted'; clicks.textContent = 'clicks: ...';
    card.append(a, sub, clicks); list.append(card);
    fetch('/api/stats/' + encodeURIComponent(l.code))
      .then(r => r.ok ? r.json() : null)
      .then(s => { clicks.textContent = s ? 'clicks: ' + s.click_count : 'clicks: n/a'; })
      .catch(() => {});
  }
}
render();
</script>
</body>
</html>
