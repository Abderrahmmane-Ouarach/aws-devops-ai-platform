global:
  scrape_interval: 15s

scrape_configs:
  - job_name: app
    metrics_path: /metrics
    static_configs:
      - targets: ['APP_PRIVATE_IP:3000']

  - job_name: node
    static_configs:
      - targets: ['APP_PRIVATE_IP:9100']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']